inline:  
  results:  
    text: "چون توی کوئری اینلاین نمی‌تونم چت رو تشخیص بدم، باید روی دکمه زیر بزنی تا نتیجه رو ببینی."
    text_legacy_group: "این گروه سوپرگروه نیست، برای همین از روی کوئری اینلاین نمی‌تونم تشخیصش بدم — برای دیدن نتیجه دکمه‌ی زیر رو بزن.\n\nاین دکمه هر بار لازمه. بهتر از اون، بات رو به چت اضافه کن و دکمه‌ی فعال‌سازیش رو بزن! اون‌وقت دستورهای معمولی کافیه و نتیجه‌های اینلاین هم با همون‌ها حساب می‌شن.\n\nاین کار رو قبل از اینکه گروه به سوپرگروه تبدیل بشه انجام بده: وگرنه هر چیزی که اینجا با اینلاین بازی شده برای همیشه از بین می‌ره."
    button: "بزن روم!"  

    titles:
      grow: "کیرتو کلفت کن!"
      top: "کلفت ترین کیر های توی چتو ببین"
      dick_of_day: "کیر روز رو انتخاب کن"
