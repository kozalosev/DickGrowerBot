# Name decorations, shared by a user across all chats.
# Keys are stored in User_Customizations.customization_name; keep them stable (up to 64 characters).
# Prefix and suffix are plain text (HTML is escaped). Either may be omitted.
# Add or edit entries here, then send SIGHUP to reload them without rebuilding.

