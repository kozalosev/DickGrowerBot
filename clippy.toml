# `literal` is a `const fn` so that a value its type would refuse fails the build. That only happens
# where the language forces const evaluation, which an ordinary call never does — so the constructor
# is reachable only through `literal!`, which puts it inside a `const` block.
#
# The lint doesn't skip macro expansions; it reports them against the line `literal!` is defined on,
# where a single `#[allow]` covers them. Everything listed here is therefore a bare call.
#
# Three things about this list:
#   * the path must be the canonical one, through the module the type is declared in — a path
#     through the `pub use` re-export does not resolve;
#   * a path that resolves to nothing is ignored *silently*, so a typo here disables the rule for
#     that type without a word. `cargo test literal` builds one bare call per type and fails
#     if any of them goes unreported;
#   * `disallowed-methods` takes no globs, so a new domain number stays unprotected until it is
#     added. The string domain types are absent: `#[domain_type]` generates no `literal` for them.
disallowed-methods = [
    { path = "dick_grower_bot::domain::primitives::numbers::AffectedRows::literal", reason = "use literal!(AffectedRows = …)" },
    { path = "dick_grower_bot::domain::primitives::numbers::AttemptsCount::literal", reason = "use literal!(AttemptsCount = …)" },
